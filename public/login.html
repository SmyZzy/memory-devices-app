<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Запоминающие устройства ЭВМ</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="logo">&#x1F4BE; ЗУ ЭВМ</a>
      <div class="nav-links">
        <a href="/">Главная</a>
        <a href="/theory">Теория</a>
      </div>
    </div>
  </nav>
  <main class="container">
    <div class="auth-form">
      <div class="auth-icon">&#x1F512;</div>
      <h2>Вход в систему</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Логин</label>
          <input type="text" id="username" name="username" placeholder="Введите логин" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" placeholder="Введите пароль" required minlength="8" autocomplete="current-password">
          <small>Минимум 8 символов</small>
        </div>
        <div id="loginError" class="error-message"></div>
        <button type="submit" class="btn btn-primary btn-block">
          <span class="btn-icon">&#x279C;</span>
          Войти
        </button>
      </form>
      <p class="auth-hint">Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
    </div>
  </main>
  <footer>
    <div class="container">
      <p>&copy; 2024-2026 Архитектура аппаратных средств.</p>
    </div>
  </footer>
  <script src="/js/main.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorDiv = document.getElementById('loginError');
      errorDiv.textContent = '';
      const password = document.getElementById('password').value;
      if (password.length < 8) {
        errorDiv.textContent = 'Пароль должен содержать минимум 8 символов';
        return;
      }
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: password
          })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = data.role === 'teacher' ? '/teacher' : '/student';
        } else {
          errorDiv.textContent = data.error;
        }
      } catch (err) {
        errorDiv.textContent = 'Ошибка подключения';
      }
    });
  </script>
</body>
</html>

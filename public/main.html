<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главная — Запоминающие устройства ЭВМ</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body>
  <main class="container">
    <section class="page-header">
      <h1>Главная страница</h1>
    </section>
    <section class="topics-preview">
      <h2>Темы курса</h2>
      <div id="topicsList" class="topic-list"></div>
    </section>
  </main>
  <footer>
    <div class="container">
      <p>&copy; 2024-2026 Архитектура аппаратных средств. Запоминающие устройства ЭВМ.</p>
    </div>
  </footer>
  <script src="/js/main.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    async function loadTopics() {
      try {
        const res = await fetch('/api/theory/topics');
        const data = await res.json();
        const container = document.getElementById('topicsList');
        if (data.topics) {
          container.innerHTML = data.topics.map(t =>
            `<div class="topic-card"><h3>${t.title}</h3><a href="/theory-detail.html?id=${t.id}" class="btn btn-sm btn-primary">Перейти</a></div>`
          ).join('');
        }
      } catch (err) {
        console.error(err);
      }
    }
    loadTopics();
  </script>
</body>
</html>
